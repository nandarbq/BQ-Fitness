<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#B3122A">
<title>Atur Kata Sandi Baru - BQ Fitness</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BQ Fitness">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="authScreen">
  <div class="auth-box">
    <div class="auth-logo">
      <span class="brand-badge">BQ</span>
      <div class="auth-brand-text">
        <span class="brand-word">FITNESS</span>
        <span class="brand-sub">Temani perjalananmu</span>
      </div>
    </div>
    <div class="auth-card">
      <h2 style="margin:0 0 4px">Atur Kata Sandi Baru</h2>
      <p class="auth-tagline">Masukkan kata sandi baru untuk akunmu.</p>
      <p class="auth-error" id="msg"></p>
      <form id="resetForm">
        <label>Kata sandi baru <input type="password" id="pw" class="text-input" required minlength="6" autocomplete="new-password"></label>
        <label>Ulangi kata sandi <input type="password" id="pw2" class="text-input" required minlength="6" autocomplete="new-password"></label>
        <button type="submit" class="cta-btn">Simpan Kata Sandi</button>
      </form>
      <p class="auth-switch"><a id="backToApp">Lanjut ke aplikasi</a></p>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/reset-password.js"></script>
</body>
</html>
